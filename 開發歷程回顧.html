<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能檢車｜開發歷程回顧</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<style>
  :root{
    --bg: #fbfaf7;
    --panel: #ffffff;
    --ink: #22262b;
    --ink-soft: #565f68;
    --line: #e3e0d8;
    --accent: #2f5d50;
    --accent-soft: #eaf1ee;
    --code-bg: #f2f0ea;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  .layout{
    display:grid;
    grid-template-columns: 260px minmax(0,780px);
    justify-content:center;
    gap:48px;
    max-width:1180px;
    margin:0 auto;
    padding:56px 24px 120px;
  }
  nav{
    position:sticky;
    top:40px;
    align-self:start;
    max-height:calc(100vh - 80px);
    overflow-y:auto;
    font-size:13.5px;
    color:var(--ink-soft);
    padding-right:8px;
  }
  nav .nav-title{
    font-family:var(--serif);
    font-size:15px;
    color:var(--ink);
    font-weight:700;
    margin-bottom:14px;
    letter-spacing:.02em;
  }
  nav a{
    display:block;
    color:var(--ink-soft);
    text-decoration:none;
    padding:5px 0 5px 12px;
    border-left:2px solid transparent;
    transition:.15s;
  }
  nav a:hover{ color:var(--accent); border-left-color:var(--accent);}
  main{ min-width:0; }
  header.doc-head{
    border-bottom:1px solid var(--line);
    padding-bottom:28px;
    margin-bottom:36px;
  }
  header.doc-head .eyebrow{
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:700;
    margin-bottom:10px;
  }
  header.doc-head h1{
    font-family:var(--serif);
    font-size:32px;
    margin:0 0 12px;
    line-height:1.4;
    font-weight:700;
  }
  header.doc-head p{
    color:var(--ink-soft);
    font-size:14.5px;
    max-width:60ch;
  }
  .prose h1{
    font-family:var(--serif);
    font-size:26px;
    margin:56px 0 20px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .prose h2{
    font-family:var(--serif);
    font-size:22px;
    margin:48px 0 18px;
    color:var(--ink);
    position:relative;
    padding-left:14px;
  }
  .prose h2::before{
    content:"";
    position:absolute;
    left:0; top:5px; bottom:5px;
    width:4px;
    background:var(--accent);
    border-radius:2px;
  }
  .prose h3{
    font-size:17.5px;
    margin:30px 0 12px;
    color:var(--accent);
    font-weight:700;
  }
  .prose p{ margin:14px 0; font-size:15.5px; }
  .prose ul, .prose ol{ font-size:15.5px; padding-left:1.4em; }
  .prose li{ margin:6px 0; }
  .prose strong{ color:var(--ink); font-weight:700; background:linear-gradient(transparent 60%, var(--accent-soft) 60%);}
  .prose hr{ border:none; border-top:1px dashed var(--line); margin:44px 0; }
  .prose code{
    font-family:var(--mono);
    background:var(--code-bg);
    padding:2px 6px;
    border-radius:4px;
    font-size:.88em;
  }
  .prose pre{
    background:#1e2126;
    color:#e6e6e3;
    padding:16px 18px;
    border-radius:10px;
    overflow-x:auto;
    font-size:13.5px;
  }
  .prose pre code{ background:none; padding:0; color:inherit; }
  .prose table{
    width:100%;
    border-collapse:collapse;
    margin:20px 0;
    font-size:14px;
  }
  .prose th, .prose td{
    border:1px solid var(--line);
    padding:8px 12px;
    text-align:left;
  }
  .prose th{
    background:var(--accent-soft);
    color:var(--accent);
    font-weight:700;
  }
  .prose tr:nth-child(even) td{ background:#f7f6f2; }
  .prose blockquote{
    margin:18px 0;
    padding:4px 18px;
    border-left:3px solid var(--accent);
    color:var(--ink-soft);
    background:var(--accent-soft);
    border-radius:0 6px 6px 0;
  }
  .mermaid-wrap{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px;
    margin:26px 0;
    overflow-x:auto;
    text-align:center;
  }
  .mermaid-wrap svg{ max-width:100%; height:auto; }
  ::selection{ background:var(--accent-soft); }
  @media (max-width: 900px){
    .layout{ grid-template-columns: 1fr; padding:32px 18px 100px; }
    nav{ position:static; max-height:none; margin-bottom:8px; border-bottom:1px solid var(--line); padding-bottom:16px;}
  }
</style>
</head>
<body>
<div class="layout">
  <nav id="toc"></nav>
  <main>
    <header class="doc-head">
      <div class="eyebrow">開發筆記 · 技術回顧</div>
      <h1>智能檢車｜開發歷程回顧</h1>

    </header>
    <div class="prose" id="content">載入中…</div>
  </main>
</div>

function decodeContent(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++){ bytes[i] = binary.charCodeAt(i); }
  return new TextDecoder('utf-8').decode(bytes);
}

const markdown = decodeContent(B64_CONTENT);

marked.setOptions({ gfm:true, breaks:false });

const renderer = new marked.Renderer();
let mermaidCount = 0;
const mermaidBlocks = [];
renderer.code = function(code, infostring){
  const lang = (infostring || '').trim();
  if(lang === 'mermaid'){
    const id = 'mermaid-' + (mermaidCount++);
    mermaidBlocks.push({id, code});
    return '<div class="mermaid-wrap" id="' + id + '"></div>';
  }
  const escaped = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return '<pre><code>' + escaped + '</code></pre>';
};

const html = marked.parse(markdown, { renderer });
document.getElementById('content').innerHTML = html;

// Render mermaid diagrams
(async () => {
  for(const block of mermaidBlocks){
    try{
      const { svg } = await mermaid.render(block.id + '-svg', block.code);
      document.getElementById(block.id).innerHTML = svg;
    }catch(e){
      document.getElementById(block.id).innerHTML = '<pre style="text-align:left;color:#a33;">圖表渲染失敗：' + e.message + '</pre>';
    }
  }
})();

// Build TOC from h2 headings
function buildTOC(){
  const content = document.getElementById('content');
  const headers = content.querySelectorAll('h2');
  const nav = document.getElementById('toc');
  const title = document.createElement('div');
  title.className = 'nav-title';
  title.textContent = '目錄';
  nav.appendChild(title);
  headers.forEach((h, i) => {
    const id = 'section-' + i;
    h.id = id;
    const a = document.createElement('a');
    a.href = '#' + id;
    a.textContent = h.textContent;
    nav.appendChild(a);
  });
}
buildTOC();
